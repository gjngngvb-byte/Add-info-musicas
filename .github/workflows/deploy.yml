name: Publicar TrackSheet Studio no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Injetar Secret GEMINI_API_KEY e preparar site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          sed -i "s|__GEMINI_API_KEY__|${GEMINI_API_KEY}|g" _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar pacote para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
